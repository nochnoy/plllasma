; Настройки PHP для локальной docker-разработки (docker-compose.yml, сервис web).
; На проде php.ini свой, этот файл туда просто приезжает вместе с кодом.
short_open_tag = On
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
; Сайт принимает аттачменты до 1 ГБ (ATTACHMENT_MAX_WEIGHT_MB в api/include/main.php)
upload_max_filesize = 1100M
post_max_size = 1200M
memory_limit = 512M
